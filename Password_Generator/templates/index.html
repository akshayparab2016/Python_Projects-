<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <div class="main-container">
      <div class="password-card">
        <div class="text-center mb-4">
          <h1 class="title">🔐 Password Generator</h1>
          <p class="subtitle">Generate strong and secure passwords instantly</p>
        </div>

        <form method="POST">
          <div class="mb-3">
            <label for="length" class="form-label"> Password Length </label>

            <input
              type="number"
              class="form-control custom-input"
              id="length"
              name="length"
              min="1"
              max="100"
              placeholder="Enter length (1-100)"
              required
            />
          </div>

          <div class="options-section">
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="alphabets"
                name="alphabets"
              />
              <label class="form-check-label" for="alphabets">
                Include Alphabets
              </label>
            </div>

            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="numbers"
                name="numbers"
              />
              <label class="form-check-label" for="numbers">
                Include Numbers
              </label>
            </div>

            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="specials"
                name="specials"
              />
              <label class="form-check-label" for="specials">
                Include Special Characters
              </label>
            </div>
          </div>

          <button type="submit" class="btn generate-btn w-100">
            Generate Password
          </button>
        </form>

        {% if password %}
        <div class="password-section mt-4">
          <h5 class="mb-3">Generated Password</h5>

          <div class="password-box">{{ password }}</div>
        </div>
        {% endif %}
      </div>
    </div>
  </body>
</html>
